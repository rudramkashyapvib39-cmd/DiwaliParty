:root{

  --pink:#ff3d6e;
  --violet:#9b2cff;
  --cream:#fff6e8;
  --mute:#c9a88a;
  --good:#3dd68c;
  --bad:#ff4d6d;
  --line:rgba(255,200,80,.18);
  --f-display:'Yatra One','Rozha One',Georgia,serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Martian Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
html,body{background:var(--ink);color:var(--cream);height:100%;}
html{scroll-padding-top:var(--safe-top);}
body{
  font-family:var(--f-body);font-size:16px;line-height:1.4;
  margin:0;padding:0;
  padding-left:max(12px,var(--safe-l));
  padding-right:max(12px,var(--safe-r));
  min-height:100%;
  min-height:100dvh;
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%, #3a1800 0%, transparent 55%),
    radial-gradient(ellipse 90% 60% at 100% 100%, #4a0c1a 0%, transparent 50%),
    radial-gradient(ellipse 80% 50% at 0% 80%, #2a0a40 0%, transparent 45%),
    linear-gradient(180deg, #0f0800 0%, #1a0a00 40%, #120600 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
*{box-sizing:border-box}
.display{font-family:var(--f-display);font-weight:400;letter-spacing:.02em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gold-text{
  background:linear-gradient(180deg,#fff8d0 0%,var(--gold) 40%,#e89b1a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(255,180,40,.35);
}
.glass{
  background:linear-gradient(165deg,rgba(255,180,60,.12),rgba(80,20,0,.35));
  border:1px solid var(--line);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:1.25rem;
  box-shadow:0 16px 50px -20px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,220,120,.12);
}

/* Floating fireworks / sparkles layer */
.beams{
  position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
}
.beams::before,.beams::after{
  content:"";position:absolute;inset:-20%;
  background:
    radial-gradient(2px 2px at 20% 30%, #ffd700 0%, transparent 100%),
    radial-gradient(2px 2px at 60% 70%, #ff6b35 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 80% 20%, #fff 0%, transparent 100%),
    radial-gradient(2px 2px at 40% 80%, #ff3d6e 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 10% 60%, #9b2cff 0%, transparent 100%),
    radial-gradient(2px 2px at 90% 50%, #ffc94a 0%, transparent 100%);
  background-size:200px 200px;
  animation:twinkle 8s linear infinite;
  opacity:.7;
}
.beams::after{animation-delay:-4s;opacity:.45;transform:scale(1.3);}
@keyframes twinkle{from{transform:translateY(0)}to{transform:translateY(-200px)}}

/* Firecracker burst particles */
.fireworks{
  position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;
}
.fw{
  position:absolute;width:4px;height:4px;border-radius:50%;
  animation:burst 2.8s ease-out infinite;
  opacity:0;
}
@keyframes burst{
  0%{transform:translate(0,0) scale(1);opacity:0}
  8%{opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
}

/* Diya / lamp decorations */
.diya-row{
  display:flex;justify-content:center;gap:10px;pointer-events:none;
  padding:6px 0;filter:drop-shadow(0 0 8px rgba(255,160,40,.6));
}
.diya{
  font-size:1.35rem;animation:flicker 1.6s ease-in-out infinite alternate;
  display:inline-block;
}
.diya:nth-child(2){animation-delay:.3s}
.diya:nth-child(3){animation-delay:.6s}
.diya:nth-child(4){animation-delay:.9s}
.diya:nth-child(5){animation-delay:1.2s}
@keyframes flicker{
  0%{transform:scale(1) rotate(-3deg);filter:brightness(1)}
  100%{transform:scale(1.12) rotate(3deg);filter:brightness(1.35)}
}

/* Buttons — bigger for mobile thumbs */
.btn{
  font-family:var(--f-body);font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  border-radius:999px;padding:.95rem 1.35rem;cursor:pointer;border:1px solid transparent;
  transition:transform .15s,filter .15s,opacity .15s,background .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  line-height:1.1;font-size:.88rem;user-select:none;-webkit-tap-highlight-color:transparent;
  min-height:48px;
}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tgl:focus-visible{
  outline:2px solid var(--gold);outline-offset:3px;
}
.btn-gold{
  background:linear-gradient(180deg,#ffe9a0,var(--gold) 50%,#d48a10);
  color:#2a1400;
  box-shadow:0 8px 28px -8px rgba(255,180,40,.75),inset 0 1px 0 rgba(255,255,255,.55);
}
.btn-pink{
  background:linear-gradient(180deg,#ff7a9a,var(--pink) 55%,#c01040);
  color:#fff;
  box-shadow:0 8px 28px -8px rgba(255,60,100,.75),inset 0 1px 0 rgba(255,255,255,.35);
}
.btn-good{
  background:linear-gradient(180deg,#5ef0b0,var(--good));
  color:#032a1a;
  box-shadow:0 8px 28px -10px rgba(61,214,140,.7);
}
.btn-bad{
  background:linear-gradient(180deg,#ff8aa0,var(--bad));
  color:#2a0008;
}
.btn-ghost{
  background:rgba(255,180,60,.08);
  border-color:var(--line);
  color:var(--cream);
}
.btn-ghost:hover:not(:disabled){background:rgba(255,180,60,.16)}
.btn-sm{padding:.6rem .95rem;font-size:.76rem;min-height:40px}
.btn-xl{padding:1.2rem 1.8rem;font-size:1.05rem;min-height:56px;width:100%}

.chip{
  font-family:var(--f-body);font-weight:600;font-size:.86rem;
  padding:.55rem .95rem;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,180,60,.07);color:var(--cream);cursor:pointer;
  transition:all .15s;line-height:1.15;min-height:40px;
}
.chip:hover{background:rgba(255,180,60,.15)}
.chip[aria-pressed="true"]{
  background:linear-gradient(180deg,#ffe9a0,var(--gold));
  color:#2a1400;border-color:transparent;
  box-shadow:0 6px 18px -6px rgba(255,180,40,.7);
}
.chip:disabled{opacity:.4;cursor:not-allowed}

.lbl{
  font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);font-weight:500;
}
input[type=text],input[type=number],select,textarea{
  background:rgba(20,8,0,.7);border:1px solid var(--line);color:var(--cream);
  border-radius:.9rem;padding:.75rem .9rem;font-family:var(--f-body);font-size:1rem;
  width:100%;min-width:0;min-height:48px;
}
textarea{resize:vertical;min-height:3rem}
input::placeholder,textarea::placeholder{color:#9a7a5a}
select option{background:#1a0a00;color:var(--cream)}

.tgl{
  width:2.9rem;height:1.65rem;border-radius:999px;
  background:rgba(255,180,60,.15);border:1px solid var(--line);
  position:relative;cursor:pointer;flex:none;transition:background .2s;
}
.tgl::after{
  content:"";position:absolute;top:2px;left:2px;
  width:1.25rem;height:1.25rem;border-radius:50%;background:#fff;
  transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.4);
}
.tgl[aria-checked="true"]{background:var(--saffron)}
.tgl[aria-checked="true"]::after{transform:translateX(1.2rem)}

.pill{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;
  text-transform:uppercase;padding:.35rem .7rem;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,180,60,.08);
}
.d-easy{color:#7ff0c0;border-color:rgba(61,214,140,.45)}
.d-medium{color:#ffe08a;border-color:rgba(255,200,80,.5)}
.d-hard{color:#ff9ac8;border-color:rgba(255,60,110,.5)}
.d-impossible{color:#ff6b6b;border-color:rgba(255,77,109,.7);background:rgba(255,77,109,.12)}

.wheel-glow{filter:drop-shadow(0 0 32px rgba(255,140,40,.55)) drop-shadow(0 0 70px rgba(255,60,100,.35))}
.spin-hub{
  position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;
  border:3px solid #fff3c4;
  background:radial-gradient(circle at 35% 30%,#fff6c8,var(--gold) 55%,#b86e00);
  color:#2a1400;font-family:var(--f-display);font-size:clamp(.95rem,3.6vw,1.55rem);
  cursor:pointer;
  box-shadow:0 0 0 6px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.55),0 0 40px rgba(255,180,40,.4);
  transition:transform .15s;
}
.spin-hub:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.07)}
.spin-hub:active:not(:disabled){transform:translate(-50%,-50%) scale(.95)}
.spin-hub:disabled{filter:grayscale(.5) brightness(.7);cursor:not-allowed}

.ticker{display:flex;gap:2rem;white-space:nowrap;animation:tick 55s linear infinite;width:max-content}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.poster-wheel{
  border-radius:50%;
  background:conic-gradient(
    #ff3d6e 0 30deg,#2e1400 0 60deg,#ffc94a 0 90deg,#9b2cff 0 120deg,
    #1a0a00 0 150deg,#ff8c1a 0 180deg,#ff3d6e 0 210deg,#2e1400 0 240deg,
    #ffc94a 0 270deg,#9b2cff 0 300deg,#1a0a00 0 330deg,#ff8c1a 0 360deg
  );
  animation:rot 35s linear infinite;
  box-shadow:0 0 0 8px #ffc94a,0 0 0 12px #5a3000,0 0 60px rgba(255,140,40,.55);
}
@keyframes rot{to{transform:rotate(360deg)}}

.vig{position:fixed;inset:0;pointer-events:none;z-index:40}
@keyframes pulseV{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .28s linear infinite}
.scroll-thin{scrollbar-width:thin;scrollbar-color:#8a5a20 transparent}
.rowline{border-top:1px solid var(--line)}

/* Mobile app shell */
.app-shell{
  max-width:480px;margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;
  padding-top:var(--safe-top);
  padding-bottom:var(--safe-bot);
}
@media (min-width:640px){
  .app-shell{max-width:560px}
}

/* Sticky bottom host bar already present — boost it */
.sticky-host{
  position:sticky;bottom:max(8px,var(--safe-bot));
  z-index:30;
}

/* Festive header banner */
.festive-banner{
  text-align:center;padding:10px 12px 4px;
  background:linear-gradient(90deg,transparent,rgba(255,140,40,.15),transparent);
  border-bottom:1px solid var(--line);
  margin:0 -12px 8px;
}
.festive-banner .spark{animation:pulseV 1.2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){
  .beams,.beams::before,.beams::after,.ticker,.poster-wheel,.shake,.fw,.diya{animation:none!important}
}

/* ============ Confetti ============ */
function Confetti({fire,loop}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!fire)return;
    const c=ref.current;if(!c)return;const ctx=c.getContext('2d');
    const W=c.width=window.innerWidth,H=c.height=window.innerHeight;
    const cols=['#f5c451','#ff2e93','#7c3aed','#ffffff','#ff8fd0','#ffd978','#22d3ee'];
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const N=reduce?40:(loop?150:220);
    const mk=(y)=>({x:Math.random()*W,y,vx:(Math.random()-.5)*5,vy:Math.random()*3+2.2,s:Math.random()*8+5,r:Math.random()*6.28,vr:(Math.random()-.5)*.35,c:cols[Math.floor(Math.random()*cols.length)],circle:Math.random()<.3});
    let P=[];for(let i=0;i<N;i++)P.push(mk(-Math.random()*H*.9));
    let raf=0,alive=true;
    const step=()=>{
      if(!alive)return;
      ctx.clearRect(0,0,W,H);
      for(const p of P){
        p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.r+=p.vr;
        if(loop&&p.y>H+20){Object.assign(p,mk(-20));}
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
        if(p.circle){ctx.beginPath();ctx.arc(0,0,p.s/2,0,TAU);ctx.fill();}else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
        ctx.restore();
      }
      if(!loop)P=P.filter(p=>p.y<H+30);
      if(P.length)raf=requestAnimationFrame(step);else ctx.clearRect(0,0,W,H);
    };
    raf=requestAnimationFrame(step);
    return()=>{alive=false;cancelAnimationFrame(raf);ctx.clearRect(0,0,W,H);};
  },[fire,loop]);
  return html`<canvas ref=${ref} class="fixed inset-0 w-full h-full pointer-events-none" style=${{zIndex:60}} aria-hidden="true"></canvas>`;
}

/* ============ Wheel ============ */
const SEG_COLORS=[{bg:'#ff2e93',fg:'#ffffff'},{bg:'#2a0f55',fg:'#f5c451'},{bg:'#f5c451',fg:'#1e0a3a'},{bg:'#7c3aed',fg:'#ffffff'},{bg:'#12082a',fg:'#ff7ac0'},{bg:'#c026d3',fg:'#ffffff'}];
const segColor=(i,n)=>{let k=i%SEG_COLORS.length;if(i===n-1&&n>1&&k===0)k=3;return SEG_COLORS[k];};

function Wheel({segs,hideTitles,disabled,onResult,onSpinStart,muted}){
  const canvasRef=useRef(null),wrapRef=useRef(null),pointerRef=useRef(null);
  const thetaRef=useRef(0),rafRef=useRef(0),spinRef=useRef(false),bulbRef=useRef(0);
  const dataRef=useRef({segs,hideTitles});
  dataRef.current={segs,hideTitles};
  const [spinning,setSpinning]=useState(false);

  const draw=useCallback((th)=>{
    const c=canvasRef.current;if(!c)return;const ctx=c.getContext('2d');
    const {segs,hideTitles}=dataRef.current;const S=c.width,R=S/2,n=Math.max(segs.length,1),seg=TAU/n;
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,S,S);ctx.translate(R,R);
    const ring=S*.075,rIn=R-ring-S*.012;
    // outer ring
    let g=ctx.createRadialGradient(0,0,rIn,0,0,R);g.addColorStop(0,'#8a5400');g.addColorStop(.5,'#f5c451');g.addColorStop(1,'#6b3f00');
    ctx.beginPath();ctx.arc(0,0,R-1,0,TAU);ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();ctx.arc(0,0,rIn+S*.006,0,TAU);ctx.fillStyle='#14061f';ctx.fill();
    // bulbs
    const B=28;for(let i=0;i<B;i++){const a=i/B*TAU;const x=Math.cos(a)*(R-ring/2-S*.004),y=Math.sin(a)*(R-ring/2-S*.004);
      const on=((i+bulbRef.current)%2===0);
      ctx.beginPath();ctx.arc(x,y,S*.0125,0,TAU);ctx.fillStyle=on?'#fff6d0':'#8a5a10';
      if(on){ctx.shadowColor='#ffd24a';ctx.shadowBlur=S*.025;}ctx.fill();ctx.shadowBlur=0;}
    // segments
    ctx.save();ctx.rotate(th);
    segs.forEach((m,i)=>{
      const col=segColor(i,segs.length);
      ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,rIn,i*seg,(i+1)*seg);ctx.closePath();ctx.fillStyle=col.bg;ctx.fill();
      ctx.strokeStyle='rgba(255,223,138,.85)';ctx.lineWidth=S*.004;ctx.stroke();
      ctx.save();ctx.rotate((i+.5)*seg);ctx.fillStyle=col.fg;ctx.textBaseline='middle';ctx.textAlign='right';
      const maxW=rIn*.62;
      if(hideTitles){
        let fs=S*.044;ctx.font='800 '+fs+'px "Hanken Grotesk",system-ui,sans-serif';
        const top=m.genre.toUpperCase();while(ctx.measureText(top).width>maxW&&fs>8){fs-=1;ctx.font='800 '+fs+'px "Hanken Grotesk",system-ui,sans-serif';}
        ctx.fillText(top,rIn*.93,-S*.011);
        ctx.globalAlpha=.8;ctx.font='700 '+(S*.025)+'px "Martian Mono",ui-monospace,monospace';ctx.fillText(eraTag(m.year),rIn*.93,S*.022);ctx.globalAlpha=1;
      }else{
        let fs=S*.04;ctx.font='800 '+fs+'px "Hanken Grotesk",system-ui,sans-serif';
        let t=m.title;while(ctx.measureText(t).width>maxW&&fs>S*.024){fs-=.6;ctx.font='800 '+fs+'px "Hanken Grotesk",system-ui,sans-serif';}
        while(ctx.measureText(t).width>maxW&&t.length>4){t=t.slice(0,-2);}
        if(t!==m.title)t=t.trimEnd()+'…';
        ctx.fillText(t,rIn*.93,0);
      }
      ctx.restore();
      // star near the hub
      ctx.save();ctx.rotate((i+.5)*seg);ctx.beginPath();ctx.arc(rIn*.36,0,S*.007,0,TAU);ctx.fillStyle=col.fg;ctx.globalAlpha=.7;ctx.fill();ctx.restore();
    });
    ctx.restore();
    // film-perforation ring around the hub
    ctx.beginPath();ctx.arc(0,0,S*.155,0,TAU);ctx.fillStyle='#14061f';ctx.fill();
    for(let i=0;i<20;i++){const a=i/20*TAU;ctx.save();ctx.rotate(a);ctx.fillStyle='#f5c451';ctx.fillRect(S*.138,-S*.007,S*.022,S*.014);ctx.restore();}
  },[]);

  useEffect(()=>{
    const wrap=wrapRef.current,c=canvasRef.current;if(!wrap||!c)return;
    const fit=()=>{const dpr=Math.min(window.devicePixelRatio||1,2.5);const w=Math.round(wrap.clientWidth*dpr);if(w>0&&c.width!==w){c.width=w;c.height=w;}draw(thetaRef.current);};
    fit();let ro=null;
    if(window.ResizeObserver){ro=new ResizeObserver(fit);ro.observe(wrap);}else window.addEventListener('resize',fit);
    return()=>{if(ro)ro.disconnect();else window.removeEventListener('resize',fit);};
  },[draw]);
  useEffect(()=>{draw(thetaRef.current);},[segs,hideTitles,draw]);
  useEffect(()=>{
    if(spinning)return;
    const id=setInterval(()=>{bulbRef.current=(bulbRef.current+1)%2;draw(thetaRef.current);},520);
    return()=>clearInterval(id);
  },[spinning,draw]);
  useEffect(()=>()=>{cancelAnimationFrame(rafRef.current);spinRef.current=false;Sfx.stopSuspense();},[]);

  const flick=()=>{const p=pointerRef.current;if(p&&p.animate)p.animate([{transform:'rotate(0deg)'},{transform:'rotate(-22deg)'},{transform:'rotate(0deg)'}],{duration:110,easing:'ease-out'});};
  const spin=()=>{
    if(spinRef.current||disabled||!segs.length)return;
    Sfx.ensure();spinRef.current=true;setSpinning(true);onSpinStart&&onSpinStart();
    const n=segs.length,seg=TAU/n,w=rnd(n),j=(Math.random()-.5)*.7;
    const th0=thetaRef.current;const base=-Math.PI/2-(w+.5+j)*seg;
    const d=((((base-th0)%TAU)+TAU)%TAU)+TAU*(6+rnd(3));
    const T=6200+rnd(1800);const t0=performance.now();
    const idxAt=(th)=>{const a=((((-Math.PI/2-th)%TAU)+TAU)%TAU);return Math.floor(a/seg)%n;};
    let last=idxAt(th0);let lastBulb=0;
    Sfx.suspense(T);
    const frame=(now)=>{
      const p=Math.min(1,(now-t0)/T),e=1-Math.pow(1-p,4);
      const th=th0+d*e;thetaRef.current=th;
      if(now-lastBulb>110){bulbRef.current=(bulbRef.current+1)%2;lastBulb=now;}
      draw(th);
      const k=idxAt(th);if(k!==last){last=k;Sfx.tick();flick();}
      if(p<1)rafRef.current=requestAnimationFrame(frame);
      else{Sfx.stopSuspense();Sfx.thud();draw(th);setTimeout(()=>{spinRef.current=false;setSpinning(false);onResult(idxAt(thetaRef.current));},650);}
    };
    rafRef.current=requestAnimationFrame(frame);
  };
  const off=disabled||spinning||!segs.length;
  return html`
    <div class="flex flex-col items-center gap-5 w-full">
      <div class="relative w-[min(92vw,34rem)] max-w-full" style=${{aspectRatio:'1'}}>
        <div ref=${pointerRef} class="absolute left-1/2 z-10" style=${{top:'-1.2%',width:'9%',marginLeft:'-4.5%',transformOrigin:'50% 22%'}}>
          <svg viewBox="0 0 40 52" width="100%" aria-hidden="true"><path d="M20 50 L3 12 A19 19 0 1 1 37 12 Z" fill="#ff2e93" stroke="#fff3c4" strokeWidth="2.5"/><circle cx="20" cy="15" r="5.5" fill="#fff3c4"/></svg>
        </div>
        <div ref=${wrapRef} class="wheel-glow absolute inset-0">
          <canvas ref=${canvasRef} style=${{width:'100%',height:'100%',display:'block'}} role="img" aria-label="Roulette wheel of Bollywood movies"></canvas>
        </div>
        <button type="button" class="spin-hub" onClick=${spin} disabled=${off} aria-label="Spin the wheel">SPIN</button>
      </div>
      <button type="button" class="btn btn-pink btn-xl" onClick=${spin} disabled=${off}>${spinning?'Spinning…':'Spin the wheel'}</button>
    </div>`;
}

  return html`

function StealStage({g,act}){

function ResultStage({g,act}){

function Scoreboard({g,compact}){

        ${g.teams.map(t=>{const left=Math.max(0,T-t.played);const on=t.id===ti&&g.phase!=='end';
          return html`<div key=${t.id} class="rounded-xl px-3 py-2" style=${{background:on?'rgba(255,255,255,.1)':'rgba(255,255,255,.03)',border:'1px solid '+(on?teamColor(t.id):'var(--line)')}}>

}

/* ============ Setup ============ */
function Setup({cfg,setCfg,onStart,pool,saved,onResume,onDiscard,openMovies,dbCount}){
  const upd=(o)=>setCfg(c=>Object.assign({},c,o));
  const modeMin={two:2,four:4,solo:2};
  const setMode=(mode)=>setCfg(c=>{const P=Math.max(c.players,modeMin[mode]);const n=Object.assign({},c,{mode,players:P,sizes4:dist4(P)});if(!c.roundsTouched)n.rounds=defaultRounds(mode,P);return n;});
  const setPlayers=(P)=>setCfg(c=>{P=clamp(P,modeMin[c.mode],40);const n=Object.assign({},c,{players:P,sizes4:dist4(P)});if(!c.roundsTouched)n.rounds=defaultRounds(c.mode,P);return n;});
  const sum4=cfg.sizes4.reduce((a,b)=>a+b,0);
  const bad4=cfg.mode==='four'&&(sum4!==cfg.players||cfg.sizes4.some(s=>s<1));
  const teamsN=cfg.mode==='two'?2:cfg.mode==='four'?4:cfg.players;
  const turns=teamsN*cfg.rounds;
  const mins=Math.round(turns*(cfg.duration+35)/60);
  const members=(key,label)=>html`<details class="mt-1"><summary class="text-[.78rem] text-[var(--mute)] cursor-pointer">${label}</summary><textarea id=${'m-'+key} class="mt-1" placeholder="Names, separated by commas (optional)" value=${cfg.members[key]||''} onInput=${(e)=>upd({members:Object.assign({},cfg.members,{[key]:e.target.value})})}></textarea></details>`;
  const ticker=useMemo(()=>shuffle(BASE_DB).slice(0,40).map(m=>m.title),[]);
  return html`
    <div class="relative z-10 py-8 lg:py-12 max-w-6xl mx-auto grid gap-10 lg:grid-cols-[minmax(0,1fr)_minmax(0,34rem)] items-start">
      <header class="flex flex-col gap-6 lg:sticky lg:top-10">
        <div class="diya-row" aria-hidden="true"><span class="diya">🪔</span><span class="diya">🪔</span><span class="diya">🪔</span><span class="diya">🪔</span><span class="diya">🪔</span></div>
        <div class="lbl">Diwali night · Bollywood dumb charades</div>
        <h1 class="display gold-text leading-[.92]" style=${{fontSize:'clamp(3.6rem,13vw,8.6rem)'}}>DIWALI<br/>DIWALI WHEEL</h1>
        <p class="text-lg text-[var(--mute)] max-w-md">Light the diyas, spin the wheel, act the film — let the whole room shout the title! Made for one phone in a festive room full of friends.</p>
        <div class="hidden lg:block poster-wheel" style=${{width:'15rem',height:'15rem'}} aria-hidden="true"></div>
        <div class="overflow-hidden rounded-full border border-[var(--line)] py-2" style=${{maskImage:'linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)',WebkitMaskImage:'linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)'}} aria-hidden="true">
          <div class="ticker mono text-[.72rem] uppercase tracking-widest text-[var(--gold)]">${ticker.concat(ticker).map((t,i)=>html`<span key=${i}>${t}</span>`)}</div>
        </div>
      </header>
      <main class="glass p-5 sm:p-7 flex flex-col gap-7">
        ${saved&&html`<div class="rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3" style=${{background:'rgba(245,196,81,.1)',border:'1px solid rgba(245,196,81,.5)'}}>
          <div><div class="font-bold">Party in progress 🪔</div><div class="text-sm text-[var(--mute)]">Turn ${saved.turn+1} of ${saved.teams.length*saved.cfg.rounds} · ${saved.teams.map(t=>t.name+' '+t.score).join(' · ')}</div></div>
          <div class="flex gap-2"><button class="btn btn-gold btn-sm" onClick=${onResume}>Resume</button><button class="btn btn-ghost btn-sm" onClick=${onDiscard}>Discard</button></div></div>`}
        <${Section} label="Players">
          <div class="flex items-center justify-between gap-4 flex-wrap"><${Stepper} value=${cfg.players} min=${modeMin[cfg.mode]} max=${40} onChange=${setPlayers} label="players"/><div class="text-sm text-[var(--mute)]">Default is 14 friends</div></div>
        <//>
        <${Section} label="Teams" aside=${cfg.mode==='two'?cfg.players>1?Math.ceil(cfg.players/2)+' · '+Math.floor(cfg.players/2):'':cfg.mode==='four'?cfg.sizes4.join(' · '):'Everyone plays alone'}>
          <div class="flex flex-wrap gap-2" role="group" aria-label="Team mode">
            <${Chip} on=${cfg.mode==='two'} onClick=${()=>setMode('two')}>2 teams<//>
            <${Chip} on=${cfg.mode==='four'} onClick=${()=>setMode('four')}>4 teams<//>
            <${Chip} on=${cfg.mode==='solo'} onClick=${()=>setMode('solo')}>Individual<//>
          </div>
          ${cfg.mode==='two'&&html`<div class="grid gap-3 sm:grid-cols-2">${[0,1].map(i=>html`<div key=${i}><input id=${'n2-'+i} type="text" aria-label=${'Team '+(i+1)+' name'} maxlength="24" value=${cfg.names2[i]} onInput=${(e)=>{const a=cfg.names2.slice();a[i]=e.target.value;upd({names2:a});}}/>${members('two'+i,'Player names')}</div>`)}</div>`}
          ${cfg.mode==='four'&&html`<div class="flex flex-col gap-3">${[0,1,2,3].map(i=>html`<div key=${i}><div class="grid grid-cols-[minmax(0,1fr)_5rem] gap-2"><input id=${'n4-'+i} type="text" aria-label=${'Team '+(i+1)+' name'} maxlength="24" value=${cfg.names4[i]} onInput=${(e)=>{const a=cfg.names4.slice();a[i]=e.target.value;upd({names4:a});}}/><input id=${'s4-'+i} type="number" aria-label=${'Team '+(i+1)+' size'} min="1" max="40" value=${cfg.sizes4[i]} onInput=${(e)=>{const a=cfg.sizes4.slice();a[i]=Math.max(0,parseInt(e.target.value)||0);upd({sizes4:a});}}/></div>${members('four'+i,'Player names')}</div>`)}
            <div class=${'text-sm '+(bad4?'text-[var(--bad)]':'text-[var(--mute)]')}>${bad4?'Team sizes add up to '+sum4+', but you set '+cfg.players+' players. Adjust the numbers.':'Team sizes add up to '+sum4+'.'}</div></div>`}
          ${cfg.mode==='solo'&&html`<textarea id="solo-names" placeholder=${'Player names, separated by commas (optional). Empty slots become Player 1, Player 2 and so on.'} value=${cfg.solo} onInput=${(e)=>upd({solo:e.target.value})}></textarea>`}
        <//>
        <${Section} label="Round timer">
          <div class="flex flex-wrap gap-2">${[30,45,60,90].map(s=>html`<${Chip} key=${s} on=${cfg.duration===s} onClick=${()=>upd({duration:s})}>${s} seconds<//>`)}</div>
        <//>
        <${Section} label=${cfg.mode==='solo'?'Turns per player':'Rounds per team'} aside=${turns+' turns · about '+mins+' min'}>
          <${Stepper} value=${cfg.rounds} min=${1} max=${10} onChange=${(v)=>upd({rounds:v,roundsTouched:true})} label="rounds"/>
        <//>
        <${FilterBlock} f=${cfg} set=${(f)=>upd({diffs:f.diffs,eras:f.eras,cats:f.cats})}/>
        <${Section} label="Table rules">
          <${Toggle} on=${cfg.steal} onChange=${(v)=>upd({steal:v})} label="Steal round 🧨" hint="After a miss, a rival team can guess for +5"/>
          <${Toggle} on=${cfg.hideTitles} onChange=${(v)=>upd({hideTitles:v})} label="Hide titles on the wheel" hint="Segments show genre and era so spectators learn nothing"/>
        <//>
        <div class="flex flex-col gap-3">
          <div class="flex items-center justify-between gap-3 flex-wrap"><div class=${'mono text-sm '+(pool<1?'text-[var(--bad)]':'text-[var(--gold)]')}>${pool} of ${dbCount} movies in play</div><button class="btn btn-ghost btn-sm" onClick=${openMovies}><${Icon} d=${IC.film} size=${15}/> Manage movies</button></div>
          <button class="btn btn-pink btn-xl w-full" disabled=${pool<1||bad4} onClick=${onStart}>Start the Diwali Party 🪔</button>
        </div>
      </main>
    </div>`;
}

/* ============ Modals ============ */
function Modal({title,onClose,children,wide}){
  useEffect(()=>{const h=(e)=>{if(e.key==='Escape')onClose();};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);},[onClose]);
  return html`<div class="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-6" role="dialog" aria-modal="true" aria-label=${title}>
    <div class="absolute inset-0" style=${{background:'rgba(5,2,12,.78)'}} onClick=${onClose}></div>
    <${motion.div} initial=${{y:40,opacity:0}} animate=${{y:0,opacity:1}} class=${'glass relative w-full '+(wide?'sm:max-w-3xl':'sm:max-w-xl')+' max-h-[92vh] overflow-y-auto scroll-thin p-5 sm:p-6'} style=${{background:'linear-gradient(160deg,#241046,#150a2b)',borderRadius:'1.4rem'}}>
      <div class="flex items-center justify-between mb-4 gap-3"><h2 class="display text-2xl gold-text">${title}</h2><button class="btn btn-ghost btn-sm" onClick=${onClose} aria-label="Close"><${Icon} d=${IC.x} size=${16}/></button></div>
      ${children}
    <//>
  </div>`;
}

function MovieManager({db,removedSet,onToggle,onDelete,onAdd,onResetRemoved,onClose}){
  const [q,setQ]=useState('');const [cat,setCat]=useState('');const [era,setEra]=useState('');const [dif,setDif]=useState('');const [limit,setLimit]=useState(60);
  const [nt,setNt]=useState('');const [ny,setNy]=useState('');const [ng,setNg]=useState('Comedy');const [nd,setNd]=useState('medium');
  const list=useMemo(()=>db.filter(m=>(!q||m.title.toLowerCase().includes(q.toLowerCase()))&&(!cat||matchesCat(m,cat))&&(!era||m.year==null||eraKey(m.year)===era)&&(!dif||m.diff===dif)).sort((a,b)=>(a.year||9999)-(b.year||9999)||a.title.localeCompare(b.title)),[db,q,cat,era,dif]);
  const dup=nt.trim()&&db.some(m=>m.title.toLowerCase()===nt.trim().toLowerCase());
  return html`<${Modal} title="Movie library 🎬" onClose=${onClose} wide=${true}>
    <div class="flex flex-col gap-5">
      <div class="glass p-4" style=${{borderRadius:'1rem'}}>
        <div class="lbl mb-2">Add a custom movie</div>
        <div class="grid gap-2 sm:grid-cols-[minmax(0,1fr)_6rem]"><input id="add-title" type="text" placeholder="Movie title" value=${nt} onInput=${(e)=>setNt(e.target.value)}/><input id="add-year" type="number" placeholder="Year" value=${ny} onInput=${(e)=>setNy(e.target.value)}/></div>
        <div class="grid gap-2 grid-cols-2 mt-2"><select id="add-genre" aria-label="Genre" value=${ng} onChange=${(e)=>setNg(e.target.value)}>${['Comedy','Romance','Action','Thriller','Drama'].map(x=>html`<option key=${x} value=${x}>${x}</option>`)}</select>
          <select id="add-diff" aria-label="Difficulty" value=${nd} onChange=${(e)=>setNd(e.target.value)}>${['easy','medium','hard','impossible'].map(x=>html`<option key=${x} value=${x}>${x}</option>`)}</select></div>
        <div class="flex items-center gap-3 mt-3 flex-wrap"><button class="btn btn-gold btn-sm" disabled=${!nt.trim()||dup} onClick=${()=>{onAdd({title:nt.trim(),year:ny?clamp(parseInt(ny)||0,1913,2099):null,genre:ng,diff:nd});setNt('');setNy('');}}>Add movie</button>${dup&&html`<span class="text-sm text-[var(--bad)]">That title is already in the library.</span>`}</div>
      </div>
      <div>
        <div class="grid gap-2 sm:grid-cols-4">
          <input id="lib-search" type="text" class="sm:col-span-2" placeholder="Search titles" value=${q} onInput=${(e)=>{setQ(e.target.value);setLimit(60);}}/>
          <select id="lib-cat" aria-label="Category" value=${cat} onChange=${(e)=>{setCat(e.target.value);setLimit(60);}}><option value="">All categories</option>${CAT_OPTS.map(c=>html`<option key=${c.k} value=${c.k}>${c.l}</option>`)}</select>
          <select id="lib-era" aria-label="Era" value=${era} onChange=${(e)=>{setEra(e.target.value);setLimit(60);}}><option value="">All eras</option>${ERA_OPTS.map(c=>html`<option key=${c.k} value=${c.k}>${c.l}</option>`)}</select>
        </div>
        <div class="flex items-center justify-between gap-2 mt-2 flex-wrap">
          <select id="lib-diff" aria-label="Difficulty" class="!w-auto" value=${dif} onChange=${(e)=>{setDif(e.target.value);setLimit(60);}}><option value="">Any difficulty</option>${['easy','medium','hard','impossible'].map(x=>html`<option key=${x} value=${x}>${x}</option>`)}</select>
          <div class="mono text-[.72rem] text-[var(--mute)]">${list.length} shown · ${db.length-removedSet.size} active · ${removedSet.size} removed</div>
          ${removedSet.size>0&&html`<button class="btn btn-ghost btn-sm" onClick=${onResetRemoved}>Restore all removed</button>`}
        </div>
      </div>
      <div class="flex flex-col">
        ${list.slice(0,limit).map(m=>{const off=removedSet.has(m.id);return html`<div key=${m.id} class="rowline flex items-center gap-3 py-2" style=${{opacity:off?.45:1}}>
          <div class="min-w-0 flex-1"><div class=${'font-semibold truncate '+(off?'line-through':'')}>${m.title}</div><div class="mono text-[.66rem] text-[var(--mute)]">${m.year==null?'Custom':m.year} · ${m.genre}${m.cult?' · Cult':''}${m.custom?' · Yours':''}</div></div>
          <${DiffPill} d=${m.diff}/>
          ${m.custom?html`<button class="btn btn-ghost btn-sm" onClick=${()=>onDelete(m.id)}>Delete</button>`:html`<button class="btn btn-ghost btn-sm" onClick=${()=>onToggle(m.id)}>${off?'Restore':'Remove'}</button>`}
        </div>`;})}
        ${list.length>limit&&html`<button class="btn btn-ghost btn-sm mt-3 self-center" onClick=${()=>setLimit(l=>l+80)}>Show more</button>`}
        ${!list.length&&html`<div class="text-center text-[var(--mute)] py-6">Nothing matches that search.</div>`}
      </div>
    </div>
  <//>`;
}

function SettingsModal({g,setCfg,onClose,onRestart,onNewGame}){
  const [confirm,setConfirm]=useState(null);
  const f=g.cfg;
  return html`<${Modal} title="Party settings" onClose=${onClose}>
    <div class="flex flex-col gap-6">
      <${Section} label="Round timer"><div class="flex flex-wrap gap-2">${[30,45,60,90].map(s=>html`<${Chip} key=${s} on=${f.duration===s} onClick=${()=>setCfg({duration:s})}>${s} seconds<//>`)}</div><div class="text-[.78rem] text-[var(--mute)]">Applies from the next spin.</div><//>
      <${Section} label="Table rules">
        <${Toggle} on=${f.steal} onChange=${(v)=>setCfg({steal:v})} label="Steal round 🧨" hint="Rivals guess after a miss for +5"/>
        <${Toggle} on=${f.hideTitles} onChange=${(v)=>setCfg({hideTitles:v})} label="Hide titles on the wheel" hint="Show genre and era only"/>
      <//>
      <${FilterBlock} f=${f} set=${(n)=>setCfg({diffs:n.diffs,eras:n.eras,cats:n.cats})}/>
      <div class="rowline pt-5 flex flex-wrap gap-2">
        ${confirm==='restart'?html`<span class="text-sm self-center">Reset all scores and start again?</span><button class="btn btn-bad btn-sm" onClick=${()=>{onRestart();onClose();}}>Yes, restart</button><button class="btn btn-ghost btn-sm" onClick=${()=>setConfirm(null)}>Cancel</button>`:
          confirm==='new'?html`<span class="text-sm self-center">Leave this game and return to setup?</span><button class="btn btn-bad btn-sm" onClick=${()=>{onNewGame();}}>Yes, new game</button><button class="btn btn-ghost btn-sm" onClick=${()=>setConfirm(null)}>Cancel</button>`:
          html`<button class="btn btn-ghost btn-sm" onClick=${()=>setConfirm('restart')}><${Icon} d=${IC.refresh} size=${15}/> Restart party</button><button class="btn btn-ghost btn-sm" onClick=${()=>setConfirm('new')}>New party setup</button>`}
      </div>
    </div>
  <//>`;
}

/* ============ App ============ */
function App(){
  const boot=useMemo(()=>lsGet(SAVE_KEY)||{},[]);
  const [screen,setScreen]=useState('setup');
  const [cfg,setCfg]=useState(()=>Object.assign({},DEF_CFG,boot.cfg||{}));
  const [g,setG]=useState(null);
  const [custom,setCustom]=useState(boot.custom||[]);
  const [removed,setRemoved]=useState(boot.removed||[]);
  const [muted,setMuted]=useState(!!boot.muted);
  const [modal,setModal]=useState(null);
  const [saved,setSaved]=useState(boot.g&&boot.screen==='game'&&boot.g.phase!=='end'?boot.g:null);
  const db=useMemo(()=>BASE_DB.concat(custom),[custom]);
  const removedSet=useMemo(()=>new Set(removed),[removed]);
  useEffect(()=>{Sfx.setMuted(muted);},[muted]);
  useEffect(()=>{const id=setTimeout(()=>lsSet(SAVE_KEY,{cfg,g,screen,custom,removed,muted}),250);return()=>clearTimeout(id);},[cfg,g,screen,custom,removed,muted]);

  const pool=useMemo(()=>countPool(db,removedSet,cfg),[db,removedSet,cfg.diffs,cfg.eras,cfg.cats]);
  const startGame=()=>{Sfx.ensure();setG(newGame(cfg));setScreen('game');setSaved(null);};
  const resume=()=>{Sfx.ensure();const s=saved;setG(Object.assign({},s,{resumePaused:s.phase==='acting',nonce:(s.nonce||0)+1}));setScreen('game');setSaved(null);};
  const discard=()=>{setSaved(null);};

  const act=useMemo(()=>({
    modal:(m)=>setModal(m),
    setTwist:(k)=>setG(s=>{
      if(!s||s.phase!=='wheel')return s;
      let tw=k;if(k==='surprise')tw=pick(['double','sudden','reverse','category','impossible','steal']);
      let cat=null;
      if(tw==='category'){
        const used=new Set(s.used);const opts=TWIST_CATS.filter(c=>buildSegments({db,removedSet,filters:s.cfg,used,twist:'category',twistCat:c}).segs.length>=3);
        cat=opts.length?pick(opts):pick(TWIST_CATS);
      }
      Sfx.pop();return Object.assign({},s,{twist:tw,twistCat:cat});
    }),
    pick:(movie,recycleIds)=>setG(s=>{
      if(!s||s.phase!=='wheel')return s;
      let used=s.used;if(recycleIds){const r=new Set(recycleIds);used=used.filter(id=>!r.has(id));}
      const total=turnTotalMs(s.twist,s.cfg.duration);
      return Object.assign({},s,{phase:'selected',movie,used:used.concat([movie.id]),total,left:total,skipped:false,notice:recycleIds?'Pool refilled':'',resumePaused:false,nonce:s.nonce+1});
    }),
    startActing:()=>setG(s=>Object.assign({},s,{phase:'acting',left:s.total,resumePaused:false,nonce:s.nonce+1})),
    syncLeft:(l)=>setG(s=>s&&s.phase==='acting'?Object.assign({},s,{left:l}):s),
    correct:(leftMs)=>{Sfx.correct();setG(s=>{
      if(!s||s.phase!=='acting')return s;
      const before=Object.assign({},s,{left:leftMs});
      const {pts,bonus}=calcCorrect ✓(s.twist,s.total-leftMs);const ti=curTeamIdx(s);
      const teams=s.teams.map((t,i)=>i===ti?Object.assign({},t,{score:t.score+pts,played:t.played+1}):t);
      return withHist(before,Object.assign({},s,{left:leftMs,teams,turn:s.turn+1,phase:'result',last:{kind:'correct',pts,bonus,twist:s.twist,team:ti,movie:s.movie,steal:null}}));
    });},
    fail:(leftMs)=>{Sfx.fail();setG(s=>{
      if(!s||s.phase!=='acting')return s;
      const before=Object.assign({},s,{left:leftMs});
      const ti=curTeamIdx(s);let pen=0;if(s.twist==='sudden')pen=-5;if(s.twist==='steal')pen=-5;
      const teams=s.teams.map((t,i)=>i===ti?Object.assign({},t,{score:t.score+pen,played:t.played+1}):t);
      const canSteal=(s.cfg.steal||s.twist==='steal')&&s.teams.length>1;
      return withHist(before,Object.assign({},s,{left:leftMs,teams,turn:s.turn+1,phase:canSteal?'steal':'result',last:{kind:'fail',pts:pen,bonus:0,twist:s.twist,team:ti,movie:s.movie,steal:null}}));
    });},
    steal:(teamId)=>setG(s=>{
      if(!s||s.phase!=='steal')return s;
      const pts=s.twist==='steal'?10:5;
      const teams=teamId==null?s.teams:s.teams.map(t=>t.id===teamId?Object.assign({},t,{score:t.score+pts}):t);
      return withHist(s,Object.assign({},s,{teams,phase:'result',last:Object.assign({},s.last,{steal:{team:teamId,pts}})}));
    }),
    skip:(leftMs)=>setG(s=>{
      if(!s||(s.phase!=='acting'&&s.phase!=='selected'))return s;
      const before=Object.assign({},s,{left:leftMs==null?s.left:leftMs});
      const ti=curTeamIdx(s);
      const teams=s.teams.map((t,i)=>i===ti?Object.assign({},t,{score:t.score-2,skips:t.skips+1}):t);
      return withHist(before,Object.assign({},s,{teams,phase:'wheel',movie:null,skipped:true,resumePaused:false,nonce:s.nonce+1}));
    }),
    next:()=>setG(s=>{
      if(!s||s.phase!=='result')return s;
      if(s.turn>=totalTurns(s))return Object.assign({},s,{phase:'end'});
      return Object.assign({},s,{phase:'wheel',movie:null,twist:'normal',twistCat:null,skipped:false,notice:'',nonce:s.nonce+1});
    }),
    undo:()=>setG(s=>{
      if(!s||!s.history.length)return s;
      const snap=s.history[s.history.length-1];
      return Object.assign({},snap,{history:s.history.slice(0,-1),resumePaused:snap.phase==='acting',nonce:s.nonce+1});
    }),
    restart:()=>setG(s=>s?resetScores(s):s),
    playAgain:()=>setG(s=>s?resetScores(s):s),
    newGame:()=>{setModal(null);setG(null);setScreen('setup');lsDel(SAVE_KEY);},
    setCfg:(o)=>setG(s=>s?Object.assign({},s,{cfg:Object.assign({},s.cfg,o),nonce:s.nonce+1}):s)
  }),[db,removedSet]);

  const canUndo=g&&g.history.length>0&&g.phase!=='end';
  const onToggleMovie=(id)=>setRemoved(r=>r.includes(id)?r.filter(x=>x!==id):r.concat([id]));
  const onDeleteMovie=(id)=>setCustom(c=>c.filter(m=>m.id!==id));
  const onAddMovie=(o)=>setCustom(c=>c.concat([{id:'custom-'+slug(o.title)+'-'+Date.now(),title:o.title,year:o.year,genre:o.genre,cult:false,diff:o.diff,custom:true}]));

  const stageKey=g?g.phase+'-'+g.turn+'-'+g.nonce:'setup';
  return html`
    <${Fragment}>
      <div class="beams" aria-hidden="true"></div>
      ${screen==='setup'||!g?html`<${Setup} cfg=${cfg} setCfg=${setCfg} onStart=${startGame} pool=${pool} saved=${saved} onResume=${resume} onDiscard=${discard} openMovies=${()=>setModal('movies')} dbCount=${db.length-removedSet.size}/>`:html`
      <div class="relative z-10 max-w-6xl mx-auto py-4">
        <header class="flex items-center justify-between gap-3 mb-5 flex-wrap">
          <div class="flex items-baseline gap-3 min-w-0"><div class="display text-2xl gold-text">🪔 DIWALI WHEEL</div>
            <div class="mono text-[.68rem] text-[var(--mute)] hidden sm:block">${g.phase==='end'?'Final results':'Round '+(Math.min(Math.floor(g.turn/g.teams.length)+1,g.cfg.rounds))+' of '+g.cfg.rounds}</div></div>
          <div class="flex items-center gap-2">
            <button class="btn btn-ghost btn-sm" onClick=${()=>act.undo()} disabled=${!canUndo} aria-label="Undo last scoring action"><${Icon} d=${IC.undo} size=${16}/><span class="hidden sm:inline">Undo</span></button>
            <button class="btn btn-ghost btn-sm" onClick=${()=>setModal('movies')} aria-label="Movie library 🎬"><${Icon} d=${IC.film} size=${16}/><span class="hidden sm:inline">Movies</span></button>
            <button class="btn btn-ghost btn-sm" onClick=${()=>setMuted(m=>!m)} aria-label=${muted?'Unmute sound':'Mute sound'} aria-pressed=${muted}><${Icon} d=${muted?IC.mute:IC.vol} size=${16}/></button>
            <button class="btn btn-ghost btn-sm" onClick=${()=>setModal('settings')} aria-label="Party settings"><${Icon} d=${IC.cog} size=${16}/></button>
          </div>
        </header>
        ${g.phase!=='end'&&html`<div class="lg:hidden flex gap-2 overflow-x-auto scroll-thin pb-3 mb-3" aria-label="Scores">${g.teams.map(t=>html`<div key=${t.id} class="glass px-3 py-1.5 flex-none flex items-center gap-2" style=${{borderRadius:'999px',borderColor:t.id===(g.phase==='result'||g.phase==='steal'?g.last.team:curTeamIdx(g))?teamColor(t.id):'var(--line)'}}><span style=${{width:'.55rem',height:'.55rem',borderRadius:'50%',background:teamColor(t.id)}}></span><span class="text-sm font-semibold whitespace-nowrap">${t.name}</span><span class="mono font-bold">${t.score}</span></div>`)}</div>`}
        <div class=${g.phase==='end'?'':'grid gap-6 lg:grid-cols-[minmax(0,1fr)_21rem] items-start'}>
          <main class="min-w-0 pb-6">
            <${AnimatePresence} mode="wait">
              <${motion.div} key=${stageKey} ...${stageAnim}>
                ${g.phase==='wheel'&&html`<${WheelStage} g=${g} act=${act} db=${db} removedSet=${removedSet}/>`}
                ${g.phase==='selected'&&html`<${SelectedStage} g=${g} act=${act}/>`}
                ${g.phase==='acting'&&html`<${ActingStage} g=${g} act=${act}/>`}
                ${g.phase==='steal'&&html`<${StealStage} g=${g} act=${act}/>`}
                ${g.phase==='result'&&html`<${ResultStage} g=${g} act=${act}/>`}
                ${g.phase==='end'&&html`<${EndStage} g=${g} act=${act}/>`}
              <//>
            <//>
          </main>
          ${g.phase!=='end'&&html`<aside class="min-w-0 lg:sticky lg:top-4"><${Scoreboard} g=${g}/></aside>`}
        </div>
      </div>`}
      ${modal==='movies'&&html`<${MovieManager} db=${db} removedSet=${removedSet} onToggle=${onToggleMovie} onDelete=${onDeleteMovie} onAdd=${onAddMovie} onResetRemoved=${()=>setRemoved([])} onClose=${()=>setModal(null)}/>`}
      ${modal==='settings'&&g&&html`<${SettingsModal} g=${g} setCfg=${act.setCfg} onClose=${()=>setModal(null)} onRestart=${act.restart} onNewGame=${act.newGame}/>`}
    <//>`;
}


/* ===== Diwali fireworks particles ===== */
(function(){
  const layer = document.getElementById('fw-layer');
  if(!layer) return;
  const colors = ['#ffc94a','#ff8c1a','#ff3d6e','#9b2cff','#fff','#ff6b35','#ffe28a'];
  function spawn(){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const n = 10 + Math.floor(Math.random()*8);
    const ox = 10 + Math.random()*80;
    const oy = 15 + Math.random()*50;
    for(let i=0;i<n;i++){
      const el = document.createElement('div');
      el.className = 'fw';
      const angle = Math.random()*Math.PI*2;
      const dist = 40 + Math.random()*120;
      el.style.left = ox + '%';
      el.style.top = oy + '%';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
      el.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
      el.style.animationDelay = (Math.random()*0.3) + 's';
      el.style.width = el.style.height = (2 + Math.random()*4) + 'px';
      layer.appendChild(el);
      setTimeout(()=>el.remove(), 3000);
    }
  }
  setInterval(spawn, 1800);
  setTimeout(spawn, 400);
})();

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();
</script>
